<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PediaMap | Find Pediatric Providers</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🩺</span>
        <span class="logo-text">Pedia<span class="logo-accent">Map</span></span>
      </div>
      <p class="tagline">Finding the right care for your little ones</p>
    </div>
  </header>

  <main>

    <!-- Search -->
    <section class="search-section" aria-labelledby="search-heading">
      <h2 id="search-heading">Search for Pediatric Providers</h2>
      <form id="search-form" aria-labelledby="search-heading">
        <div class="form-row">
          <div class="form-group">
            <label for="city-input">City</label>
            <input type="text" id="city-input" name="city" placeholder="e.g. Boston" required />
          </div>
          <div class="form-group">
            <label for="state-input">State</label>
            <input type="text" id="state-input" name="state" placeholder="e.g. MA" maxlength="2" required />
          </div>
          <button type="submit">
            <span>🔍</span> Search
          </button>
        </div>
      </form>
    </section>

    <!-- Providers -->
    <section class="providers-section" aria-labelledby="collection-heading">
      <h2 id="collection-heading">Pediatric Providers</h2>

      <!-- Filters above the grid -->
      <div class="filter-bar">
        <div class="filter-group">
          <label for="gender-filter">Gender</label>
          <select id="gender-filter">
            <option value="all">All</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="type-filter">Provider Type</label>
          <select id="type-filter">
            <option value="all">All</option>
            <option value="MD">MD</option>
            <option value="DO">DO</option>
            <option value="NP">Nurse Practitioner</option>
            <option value="PA">Physician Assistant</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="sort-filter">Sort By</label>
          <select id="sort-filter">
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
            <option value="city-asc">City (A-Z)</option>
          </select>
        </div>
      </div>

      <div id="provider-grid"></div>
    </section>

    <!-- Favorites -->
    <section class="favorites-section" aria-labelledby="favorites-heading">
      <h2 id="favorites-heading">⭐ Saved Favorites</h2>
      <div id="favorites-grid"></div>
    </section>

  </main>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay" aria-modal="true" role="dialog" aria-labelledby="modal-provider-name"
    hidden>
    <div class="modal-card">
      <button class="modal-close" id="modal-close-btn" aria-label="Close modal">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
