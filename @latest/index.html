<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PediaMap | Find Pediatric Providers</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <!-- Header -->
  <header>
    <span aria-hidden="true">🩺</span>
    <h1>PediaMap</h1>
  </header>

  <!--Main Content-->
  
  <main>

    <section aria-labelledby="collection-heading">
      <h2 id="collection-heading">Pediatric Providers</h2>
      <ul id="provider-list">

      </ul>
    </section>

    <section aria-labelledby="details-heading">
      <h2 id="details-heading">Provider Details</h2>
      <div id="provider-details">

      </div>
    </section>
  </main>

  <!--Single Item Section-->
  <section aria-label="single-provider-heading">
    <h2> id="collection-heading">"Pediatric Providers"</h2>
    <ul id="provider-list"></ul>
  </section>
    </main>

     <!-- Search Section -->
<section aria-labelledby="search-heading">
  <h2 id="search-heading">Search for Pediatric Providers</h2>

  <form id="search-form">

    <!-- City Input -->
    <div>
      <label for="city-input">City</label>
      <input
        type="text"
        id="city-input"
        name="city"
        required
        aria-required="true"
      />
    </div>

    <!-- Submit Button -->
    <button type="submit">Search</button>

  </form>
</section>


  <!-- Main JS File -->
  <script type="module" src="/main.js"></script>
</body>

</html>
