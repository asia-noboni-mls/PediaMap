<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PediaMap | Find Pediatric Providers</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>

  <!-- Header -->
  <header>
    <h1>PediaMap 🧸</h1>
  </header>

  <!-- Main Content -->
  <main>

    <!-- Search Section -->
    <section aria-labelledby="search-heading">
      <h2 id="search-heading">Search for Pediatric Providers</h2>

      <form id="search-form">
        <div>
          <label for="city-input">City</label>
          <input
            type="text"
            id="city-input"
            name="city"
            required
          />
        </div>

        <button type="submit">Search</button>
      </form>
    </section>

    <!-- Collection Section -->
    <section aria-labelledby="collection-heading">
      <h2 id="collection-heading">Pediatric Providers</h2>
      <ul id="provider-list"></ul>
    </section>

    <!-- Single Item Section -->
    <section aria-labelledby="single-provider-heading">
      <h2 id="single-provider-heading">Provider Details</h2>
      <div id="provider-details">
        <p>Select a provider to view more details.</p>
      </div>
    </section>

  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>

</html>
